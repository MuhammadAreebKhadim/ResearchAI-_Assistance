<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f65f6"/>
      <stop offset="50%" stop-color="#5b73e8"/>
      <stop offset="100%" stop-color="#7c8ff8"/>
    </linearGradient>
    <linearGradient id="pageGlow" x1="7" y1="12" x2="29" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="13" y1="4" x2="23" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3b4ac4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with smooth drop-shadow -->
  <rect x="1" y="1" width="34" height="34" rx="9" fill="url(#logoBg)"/>
  <rect x="1" y="1" width="34" height="34" rx="9" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Left Open Book Page -->
  <path d="M7.5 23.8C10.8 22.3 14.5 22.8 17.5 24.8V13.8C14.5 11.8 10.8 11.3 7.5 12.8V23.8Z" 
        fill="url(#pageGlow)" fill-opacity="0.96"/>

  <!-- Right Open Book Page -->
  <path d="M28.5 23.8C25.2 22.3 21.5 22.8 18.5 24.8V13.8C21.5 11.8 25.2 11.3 28.5 12.8V23.8Z" 
        fill="url(#pageGlow)" fill-opacity="0.96"/>

  <!-- Book Center Spine -->
  <path d="M18 13.8V25" stroke="#4f65f6" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Dynamic Knowledge Waves / Neural lines on pages -->
  <path d="M10.2 16.2C12.2 15.4 14.6 15.6 16 16.5" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M10.2 19.2C12.2 18.4 14.6 18.6 16 19.5" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M25.8 16.2C23.8 15.4 21.4 15.6 20 16.5" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M25.8 19.2C23.8 18.4 21.4 18.6 20 19.5" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Floating 4-Point AI Spark / Star of Discovery -->
  <path d="M18 4.2L19.3 8.3L23.4 9.6L19.3 10.9L18 15L16.7 10.9L12.6 9.6L16.7 8.3L18 4.2Z" 
        fill="url(#sparkGrad)" filter="url(#subtleGlow)"/>

  <!-- Spark Core Accent -->
  <circle cx="18" cy="9.6" r="1.1" fill="#ffffff"/>
</svg>